name: Build APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

# YEH NAYA CODE HAI: GitHub Action ko repository me key save (push) karne ki permission
permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v5
      with:
        java-version: '17'
        distribution: 'temurin'

    # 100% PERMANENT KEYSTORE MANAGER (Cache hata diya gaya hai)
    - name: Manage Permanent Keystore
      run: |
        mkdir -p ~/.android
        if [ -f app/permanent_key.keystore ]; then
          echo "Permanent key mil gayi! OTA update ke liye iska use kar rahe hain..."
          cp app/permanent_key.keystore ~/.android/debug.keystore
        else
          echo "Nayi Permanent key ban rahi hai aur GitHub me hamesha ke liye save ho rahi hai..."
          keytool -genkey -v -keystore ~/.android/debug.keystore -alias androiddebugkey -storepass android -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US"
          cp ~/.android/debug.keystore app/permanent_key.keystore
          git config --global user.name "GitHub-Actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add app/permanent_key.keystore
          git commit -m "Added permanent keystore for smooth OTA updates"
          git push
        fi

    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v4
      with:
        gradle-version: '8.4'

    - name: Build Debug APK
      run: gradle assembleDebug

    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: ScreenRecorder-App
        path: app/build/outputs/apk/debug/app-debug.apk
